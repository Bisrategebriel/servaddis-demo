<!doctype html>
<!-- Offline page (TRD §3 PWA). Static and self-contained so the service worker can serve it with
     no network and no Next.js: inline styles, system fonts, both languages on one page. -->
<html lang="am">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16243f" />
    <title>Servaddis · ከመስመር ውጭ / Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #f5f6f8;
        color: #16243f;
        font-family:
          "Noto Sans Ethiopic",
          "Nyala",
          "Abyssinica SIL",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      header {
        background: #16243f;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #fff;
        font-weight: 700;
        font-size: 18px;
      }
      header span {
        color: #d9a441;
      }
      main {
        flex: 1;
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        padding: 40px 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      section {
        background: #fff;
        border: 1px solid #dde1e8;
        border-radius: 16px;
        padding: 20px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
        line-height: 1.5;
      }
      p {
        margin: 0;
        line-height: 1.7;
        color: #3b4357;
      }
      button {
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        background: #16243f;
        color: #fff;
        font: inherit;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #d9a441;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="/icons/servaddis-icon.svg" width="32" height="32" alt="" />
      Serv<span>አዲስ</span>
    </header>
    <main>
      <section lang="am">
        <h1>ከኢንተርኔት ተቋርጠዋል</h1>
        <p>ይህ ገጽ ኢንተርኔት ይፈልጋል። ሲገናኙ እንደገና ይሞክሩ። ያስገቡት ማመልከቻ አይጠፋም።</p>
      </section>
      <section lang="en">
        <h1>You're offline</h1>
        <p>
          This page needs a connection. Try again once you're back online. Applications you already
          sent are safe.
        </p>
      </section>
      <button type="button" onclick="location.reload()">እንደገና ሞክር · Try again</button>
    </main>
  </body>
</html>
